name: Deploy To GitHub Pages

on:
  push:
    branches:
      - main
  # Manual trigger, so a deployment can be verified without waiting for a push.
  workflow_dispatch:
  # A dependabot merge runs as `github-actions[bot]`, and a push made with
  # `GITHUB_TOKEN` starts no other workflow. The auto-merge workflow asks for the
  # deployment through this event instead, because a dependency bump can change
  # the bundled output even though the source did not move.
  repository_dispatch:
    types: [dependabot-merged]

# `pages: write` publishes the site and `id-token: write` lets the deployment
# prove it was started by this workflow. No token of any kind is stored: the
# site is uploaded as an artifact and published by `actions/deploy-pages`
# instead of being pushed to the `gh-pages` branch, so the build is a run of
# this workflow rather than a side effect of a branch push.
permissions:
  contents: read
  pages: write
  id-token: write
  # Declaring `permissions` sets every unlisted scope to `none`, and the guard
  # below reads the run's artifact list through the Actions API.
  actions: read

# One deployment at a time. Cancelling a running one would publish a half
# written site, so a second run waits instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Pre-built
        run: |
          npm ci
          npm run build:deployment

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload the build output
        uses: actions/upload-pages-artifact@v5
        with:
          path: .publish

      # `upload-pages-artifact` can finish before the run's artifact listing is
      # updated, and `deploy-pages` looks the artifact up by name through that
      # listing: on 2026-11-23 the upload finalized 0.3s before `deploy-pages`
      # asked, so it saw `Found 0 artifact(s)` and failed a deployment whose
      # artifact was already stored. Poll the very endpoint `deploy-pages` reads
      # instead of sleeping for an arbitrary interval.
      - name: Wait for the build output to be listed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          ARTIFACT_NAME: github-pages
        run: |
          for attempt in $(seq 1 30); do
            if gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts" \
              | jq -e --arg name "$ARTIFACT_NAME" \
                'any(.artifacts[]; .name == $name)' > /dev/null; then
              echo "The $ARTIFACT_NAME artifact is listed."
              exit 0
            fi

            echo "Waiting for the $ARTIFACT_NAME artifact to be listed (attempt $attempt)."
            sleep 2
          done

          echo "::error::The $ARTIFACT_NAME artifact never appeared in the run's artifact listing."
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
